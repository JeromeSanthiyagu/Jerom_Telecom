# 1) Build data, indexes and models once (writes to ./data):
#      docker compose run --rm api python -m src.preprocessing.build_all
# 2) Start:  docker compose up
services:
  api:
    build: .
    env_file: .env
    environment:
      - HF_HUB_OFFLINE=1
    volumes:
      - ./data:/app/data
    ports:
      - "8000:8000"
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      start_period: 120s

  ui:
    build: .
    environment:
      - API_URL=http://api:8000
    ports:
      - "8501:8501"
    depends_on:
      - api
    command: streamlit run frontend.py --server.port 8501 --server.address 0.0.0.0 --server.headless true --browser.gatherUsageStats false
